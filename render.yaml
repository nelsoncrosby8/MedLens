# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Create this as a Blueprint in the Render dashboard (New -> Blueprint, pick this repo);
# Render shows an editable preview of everything below before it creates anything. If the
# Blueprint already exists, pushing changes here and clicking "Sync" in the dashboard applies
# them (e.g. adding medlens-frontend below to an existing backend+db Blueprint).
#
# Two backend values must be filled in by hand in the Render dashboard after creation (they
# hold a private-repo access token, so they're marked `sync: false` and never live in this
# file): MODEL_WEIGHTS_ASSET_URL and GH_TOKEN. See the README "Deployment" section for how to
# obtain and set these.
#
# medlens-backend's CORS_ORIGINS must include medlens-frontend's actual URL once Render
# assigns it (it isn't known until the static site is first created) — see the README.

databases:
  - name: medlens-db
    plan: free
    databaseName: medlens
    user: medlens
    postgresMajorVersion: "16"

services:
  - name: medlens-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medlens-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: CORS_ORIGINS
        value: '["http://localhost:5173","http://localhost:3000"]'
      - key: MEDLENS_WEIGHTS_PATH
        value: /app/app/ml/weights/model.weights.h5
      - key: MODEL_WEIGHTS_ASSET_URL
        sync: false
      - key: GH_TOKEN
        sync: false

  - name: medlens-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://medlens-backend-lrwv.onrender.com
    routes:
      # Client-side routing (react-router): let the SPA handle every path.
      - type: rewrite
        source: /*
        destination: /index.html
