[pytest]
testpaths = tests
filterwarnings =
    # Starlette's TestClient nudges toward the not-yet-standard `httpx2`; `httpx` still works.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    # passlib 1.7.4 (unmaintained) imports the stdlib `crypt` module, deprecated in 3.11.
    ignore:'crypt' is deprecated and slated for removal:DeprecationWarning
