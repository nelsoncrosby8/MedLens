# Tooling config only (the backend isn't a packaged distribution).

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; keep them close to as-emitted.
"alembic/versions/*.py" = ["E501", "I001", "UP", "W291"]
"alembic/env.py" = ["I001", "E402"]
# Forward refs to models imported only under TYPE_CHECKING are intentional.
"app/models/*.py" = ["UP037"]
